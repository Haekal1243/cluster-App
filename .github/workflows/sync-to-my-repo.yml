name: Sync Ojan Branch to My Repo

on:
  push:
    branches:
      - ojan

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to My Repository
        env:
          TOKEN: ${{ secrets.MY_REPO_TOKEN_OJAN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push https://x-access-token:${TOKEN}@github.com/zuxua23/clusterapp.git ojan:main --force