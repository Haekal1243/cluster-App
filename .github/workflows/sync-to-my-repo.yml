name: Sync Ojan Branch to My Repo

on:
  push:
    branches:
      - ojan

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to My Repository
        env:
          TOKEN: ${{ secrets.MY_REPO_TOKEN_OJAN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "MY_REPO_TOKEN_OJAN kosong"; exit 1; fi
          git push "https://x-access-token:${TOKEN}@github.com/zuxua23/clusterapp.git" HEAD:refs/heads/main --force